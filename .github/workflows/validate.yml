name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      - run: bash scripts/tests/run.sh
      - run: bash scripts/check-frontmatter.sh
